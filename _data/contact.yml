# Sidebar contact options.
#
# `github` reads site.github.username and `email` reads site.social.email
# (see the theme's _includes/sidebar.html); every other type uses `url`.

- type: email
  icon: "fas fa-envelope"
  noblank: true # open link in current tab

- type: linkedin
  icon: "fab fa-linkedin"
  url: "https://www.linkedin.com/in/tyma"

- type: scholar
  icon: "fas fa-graduation-cap"
  url: "https://scholar.google.com/citations?user=xWDB92cAAAAJ"

- type: github
  icon: "fab fa-github"
