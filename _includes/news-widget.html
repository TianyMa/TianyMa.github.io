<!-- _includes/news-widget.html -->
<div id="news-widget">
    <h3>Latest Updates</h3>
    <ul id="news-list">
        {% for post in site.posts limit:5 %}
        <li><a href="{{ post.url }}">{{ post.title | truncate: 40 }}</a></li>
        {% endfor %}
        <li><a href="/posts/">View all posts &rarr;</a></li>
    </ul>
</div>
