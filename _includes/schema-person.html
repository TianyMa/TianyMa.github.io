<!-- Structured Data for Person (Author) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Tianyi Ma",
  "alternateName": "Haotian Ma",
  "url": "{{ site.url }}",
  "image": "{{ site.avatar | absolute_url }}",
  "email": "{{ site.social.email }}",
  "jobTitle": "Quantitative Researcher",
  "description": "Quantitative modelling and optimisation under uncertainty for energy and AI infrastructure.",
  "alumniOf": [
    {
      "@type": "CollegeOrUniversity",
      "name": "University College London"
    },
    {
      "@type": "CollegeOrUniversity",
      "name": "University of Warwick"
    },
    {
      "@type": "CollegeOrUniversity",
      "name": "University of Nottingham"
    },
    {
      "@type": "CollegeOrUniversity",
      "name": "Southeast University"
    }
  ],
  "hasCredential": {
    "@type": "EducationalOccupationalCredential",
    "credentialCategory": "degree",
    "educationalLevel": "PhD",
    "name": "PhD in Systems Modelling and Optimisation",
    "recognizedBy": {
      "@type": "CollegeOrUniversity",
      "name": "University College London"
    }
  },
  "sameAs": [
    {% for link in site.social.links %}
      "{{ link }}"{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ],
  "knowsAbout": [
    "Optimisation under Uncertainty",
    "Monte Carlo Simulation",
    "Mixed-Integer Optimisation",
    "Energy Systems Modelling",
    "Data Centre Infrastructure",
    "PEM Electrolysis",
    "Techno-Economic Analysis"
  ]
}
</script>
