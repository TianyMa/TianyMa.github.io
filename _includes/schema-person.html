<!-- Structured Data for Person (Author) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.social.name }}",
  "url": "{{ site.url }}",
  "image": "{{ site.avatar | absolute_url }}",
  "email": "{{ site.social.email }}",
  "jobTitle": "PhD Researcher",
  "affiliation": {
    "@type": "Organization",
    "name": "Southeast University"
  },
  "alumniOf": [
    {
      "@type": "Organization",
      "name": "Southeast University"
    }
  ],
  "sameAs": [
    {% for link in site.social.links %}
      "{{ link }}"{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ],
  "knowsAbout": [
    "Energy Systems",
    "Machine Learning",
    "Optimization",
    "Sustainable Energy",
    "Data Science"
  ]
}
</script>
