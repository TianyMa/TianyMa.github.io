<!-- Share Buttons Component -->
<div class="share-buttons">
  <button class="share-btn twitter" data-share="twitter" aria-label="Share on Twitter">
    <i class="fab fa-twitter"></i>
    <span>Tweet</span>
  </button>

  <button class="share-btn linkedin" data-share="linkedin" aria-label="Share on LinkedIn">
    <i class="fab fa-linkedin"></i>
    <span>Share</span>
  </button>

  <button class="share-btn email" data-share="email" aria-label="Share via Email">
    <i class="fas fa-envelope"></i>
    <span>Email</span>
  </button>

  <button class="share-btn copy" data-share="copy" aria-label="Copy link">
    <i class="fas fa-link"></i>
    <span>Copy Link</span>
  </button>
</div>
