<!-- Timeline Component -->
<!-- Usage: {% include timeline-item.html
     year="2024"
     title="Research Title"
     description="Description"
     image="/images/..."
     link="/posts/..."
%} -->

<div class="timeline-item fade-in-up">
  <div class="timeline-marker"></div>

  {% if include.year %}
  <div class="timeline-year">{{ include.year }}</div>
  {% endif %}

  <div class="timeline-content">
    {% if include.image %}
    <img src="{{ include.image }}"
         alt="{{ include.title }}"
         style="width: 100%; border-radius: 6px; margin-bottom: 1rem;"
         loading="lazy">
    {% endif %}

    <h3 style="margin-bottom: 0.5rem;">{{ include.title }}</h3>

    {% if include.subtitle %}
    <p style="color: var(--text-muted-color); font-size: 0.875rem; margin-bottom: 0.75rem;">
      {{ include.subtitle }}
    </p>
    {% endif %}

    {% if include.description %}
    <p style="line-height: 1.6;">{{ include.description }}</p>
    {% endif %}

    {% if include.link %}
    <a href="{{ include.link }}"
       style="display: inline-block; margin-top: 1rem; color: var(--link-color); font-weight: 500;">
      Learn more <i class="fas fa-arrow-right"></i>
    </a>
    {% endif %}
  </div>
</div>
